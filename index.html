<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Pro MAX</title>
    <style>
        :root {
            --primary: #00e5ff;
            --bg: #0f2027;
            --card-bg: rgba(255, 255, 255, 0.07);
            --success: #2e7d32;
            --danger: #c62828;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* Search & Input */
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: none;
            background: #1e1e1e;
            color: white;
            font-size: 1rem;
            outline: none;
            border: 2px solid transparent;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--primary);
            color: #000;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* Quiz UI */
        .quiz-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 20px;
        }

        .option {
            display: block;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .option:hover {
            background: rgba(255,255,255,0.1);
        }

        input[type="radio"] { display: none; }

        /* States */
        .selected { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
        .correct { background: var(--success) !important; border-color: #4caf50 !important; }
        .wrong { background: var(--danger) !important; border-color: #f44336 !important; }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 152, 0, 0.15);
            border-left: 4px solid #ff9800;
            border-radius: 5px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Navigation & Progress */
        .progress-container {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: 0.4s;
        }

        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .timer {
            text-align: right;
            font-size: 1.2rem;
            color: #ff9800;
            font-family: monospace;
            margin-bottom: 10px;
        }

        #result-display {
            text-align: center;
            font-size: 2rem;
            margin: 20px 0;
            color: var(--primary);
            display: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 AI Exam Pro MAX</h1>

    <div class="input-box">
        <input type="text" id="topic" placeholder="Enter Topic (e.g., Quantum Physics)">
        <button id="startBtn" onclick="fetchQuiz()">Generate Quiz</button>
    </div>

    <div id="quiz-area" class="hidden">
        <div class="timer" id="timer">⏱ 10:00</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="quiz-box"></div>

        <div class="nav-btns">
            <button onclick="changeQuestion(-1)">⬅ Previous</button>
            <button onclick="changeQuestion(1)">Next ➡</button>
        </div>

        <button id="submitBtn" style="width: 100%; margin-top: 20px; background: #4caf50; color: white;" onclick="submitQuiz()">Final Submission</button>
    </div>

    <div id="result-display"></div>
</div>

<script>
    let quizData = [];
    let currentIdx = 0;
    let userAnswers = [];
    let isSubmitted = false;
    let timeLeft = 600;
    let timerId;

    async function fetchQuiz() {
        const topic = document.getElementById('topic').value;
        const startBtn = document.getElementById('startBtn');
        if (!topic) return alert("Please enter a topic!");

        startBtn.disabled = true;
        startBtn.innerText = "Generating AI Quiz...";

        try {
            const response = await fetch(`/api/quiz?topic=${encodeURIComponent(topic)}`);
            quizData = await response.json();
            
            userAnswers = new Array(quizData.length).fill(null);
            currentIdx = 0;
            isSubmitted = false;
            timeLeft = 600;

            document.getElementById('quiz-area').classList.remove('hidden');
            document.getElementById('result-display').style.display = 'none';
            document.getElementById('submitBtn').classList.remove('hidden');
            
            startTimer();
            renderQuestion();
        } catch (err) {
            alert("Error fetching quiz. Make sure your server is running!");
            console.error(err);
        } finally {
            startBtn.disabled = false;
            startBtn.innerText = "Generate Quiz";
        }
    }

    function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `⏱ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (timeLeft <= 0) submitQuiz();
        }, 1000);
    }

    function renderQuestion() {
        const q = quizData[currentIdx];
        const box = document.getElementById('quiz-box');
        
        const optionsHtml = q.options.map((opt, i) => {
            let stateClass = "";
            if (userAnswers[currentIdx] === i) stateClass = "selected";
            
            if (isSubmitted) {
                if (i === q.correct) stateClass = "correct";
                else if (userAnswers[currentIdx] === i) stateClass = "wrong";
            }

            return `
                <label class="option ${stateClass}">
                    <input type="radio" name="quizOpt" value="${i}" 
                        ${userAnswers[currentIdx] === i ? 'checked' : ''} 
                        ${isSubmitted ? 'disabled' : ''}
                        onchange="handleSelect(${i})">
                    ${String.fromCharCode(65 + i)}. ${opt}
                </label>
            `;
        }).join('');

        box.innerHTML = `
            <div class="quiz-card">
                <small>Question ${currentIdx + 1} of ${quizData.length}</small>
                <h2>${q.q}</h2>
                <div class="options-list">${optionsHtml}</div>
                <div class="explanation" id="exp-box" style="display: ${isSubmitted ? 'block' : 'none'}">
                    <strong>💡 Explanation:</strong><br>${q.explanation}
                </div>
            </div>
        `;

        // Update progress bar
        document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
    }

    function handleSelect(val) {
        if (isSubmitted) return;
        userAnswers[currentIdx] = val;
        renderQuestion();
    }

    function changeQuestion(step) {
        let newIdx = currentIdx + step;
        if (newIdx >= 0 && newIdx < quizData.length) {
            currentIdx = newIdx;
            renderQuestion();
        }
    }

    function submitQuiz() {
        if (isSubmitted) return;
        if (!confirm("Do you want to submit your answers?")) return;

        isSubmitted = true;
        clearInterval(timerId);

        let score = 0;
        quizData.forEach((q, i) => {
            if (userAnswers[i] === q.correct) score++;
        });

        const resDisplay = document.getElementById('result-display');
        resDisplay.innerHTML = `🎯 Your Score: ${score} / ${quizData.length}`;
        resDisplay.style.display = 'block';
        document.getElementById('submitBtn').classList.add('hidden');
        
        currentIdx = 0; // Reset to first question for review
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
