<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Pro MAX</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; min-height: 100vh; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        h1 { text-align: center; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.3); }

        .input-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        input { padding: 12px; width: 60%; border-radius: 8px; border: none; background: #1e1e1e; color: white; }
        button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; background: #00e5ff; color: black; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:disabled { background: #555; cursor: not-allowed; }

        .quiz-card { margin-top: 20px; padding: 20px; border-radius: 15px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .option { display: block; padding: 12px; margin: 8px 0; border-radius: 8px; background: #2a2a2a; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .option:hover { border-color: #00e5ff; }
        
        /* State Classes */
        .selected { border-color: #00e5ff; background: #333; }
        .correct-ans { background: #2e7d32 !important; border-color: #4caf50 !important; }
        .wrong-ans { background: #c62828 !important; border-color: #f44336 !important; }

        .progress { height: 8px; background: #333; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: #00e5ff; transition: 0.4s; }
        .timer { text-align: right; font-size: 1.2rem; color: #ff9800; font-weight: bold; height: 30px; }

        .explanation { margin-top: 15px; padding: 15px; background: rgba(255, 152, 0, 0.1); border-left: 4px solid #ff9800; border-radius: 4px; display: none; line-height: 1.5; }
        #result { text-align: center; font-size: 1.8rem; margin: 20px 0; color: #00e5ff; font-weight: bold; }
        .nav-btns { display: flex; justify-content: space-between; margin: 20px 0; }
        .submit-btn { width: 100%; background: #4CAF50; color: white; font-size: 1.1rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 AI Exam Pro MAX</h1>

    <div class="input-box">
        <input id="topic" placeholder="Enter topic (e.g. Ancient History)">
        <button id="startBtn" onclick="fetchQuiz()">Start Quiz</button>
    </div>

    <div class="timer" id="timer"></div>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>

    <div id="quiz-container" class="hidden">
        <div id="quiz-box"></div>

        <div class="nav-btns">
            <button onclick="prevQ()">⬅ Prev</button>
            <button onclick="nextQ()">Next ➡</button>
        </div>

        <button id="subBtn" class="submit-btn" onclick="submitQuiz()">Submit Final Answers</button>
    </div>

    <div id="result"></div>
</div>

<script>
let quiz = [];
let current = 0;
let userAnswers = [];
let time = 600;
let timerInterval;
let isSubmitted = false;

function startTimer() {
    clearInterval(timerInterval);
    time = 600;
    timerInterval = setInterval(() => {
        time--;
        const mins = Math.floor(time / 60);
        const secs = time % 60;
        document.getElementById("timer").innerText = `⏱ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        if (time <= 0) submitQuiz();
    }, 1000);
}

async function fetchQuiz() {
    const topic = document.getElementById("topic").value || "General Knowledge";
    const startBtn = document.getElementById("startBtn");
    
    startBtn.disabled = true;
    startBtn.innerText = "Generating...";
    document.getElementById("result").innerText = "";
    isSubmitted = false;

    try {
        const res = await fetch(`/api/quiz?topic=${encodeURIComponent(topic)}`);
        quiz = await res.json();

        userAnswers = new Array(quiz.length).fill(null);
        current = 0;

        document.getElementById("quiz-container").classList.remove("hidden");
        document.getElementById("subBtn").classList.remove("hidden");
        startTimer();
        showQuestion();
    } catch (err) {
        alert("Failed to load quiz. Please try again.");
    } finally {
        startBtn.disabled = false;
        startBtn.innerText = "Start Quiz";
    }
}

function showQuestion() {
    const q = quiz[current];
    const quizBox = document.getElementById("quiz-box");
    
    let optionsHtml = q.options.map((opt, i) => {
        let className = "option";
        if (userAnswers[current] === i) className += " selected";
        
        // Post-submission styling
        if (isSubmitted) {
            if (i === q.correct) className += " correct-ans";
            else if (userAnswers[current] === i) className += " wrong-ans";
        }

        return `
            <label class="${className}">
                <input type="radio" name="opt" value="${i}" style="display:none"
                    ${userAnswers[current] === i ? "checked" : ""}
                    ${isSubmitted ? "disabled" : ""}
                    onchange="selectAnswer(${i})"> 
                ${String.fromCharCode(65 + i)}. ${opt}
            </label>
        `;
    }).join("");

    quizBox.innerHTML = `
        <div class="quiz-card">
            <h3>Question ${current + 1} of ${quiz.length}</h3>
            <p style="font-size: 1.2rem;">${q.q}</p>
            ${optionsHtml}
            <div class="explanation" id="exp" style="display: ${isSubmitted ? 'block' : 'none'}">
                <strong>💡 Explanation:</strong><br>${q.explanation}
            </div>
        </div>
    `;

    document.getElementById("progress").style.width = ((current + 1) / quiz.length) * 100 + "%";
}

function selectAnswer(i) {
    if (isSubmitted) return;
    userAnswers[current] = i;
    showQuestion(); // Refresh UI to show selection
}

function nextQ() {
    if (current < quiz.length - 1) {
        current++;
        showQuestion();
    }
}

function prevQ() {
    if (current > 0) {
        current--;
        showQuestion();
    }
}

function submitQuiz() {
    if (isSubmitted) return;
    if (!confirm("Are you sure you want to submit?")) return;

    isSubmitted = true;
    clearInterval(timerInterval);
    
    let score = 0;
    quiz.forEach((q, i) => {
        if (userAnswers[i] === q.correct) score++;
    });

    document.getElementById("result").innerHTML = `🎯 Final Score: ${score} / ${quiz.length}`;
    document.getElementById("subBtn").classList.add("hidden");
    
    // Jump to first question to review
    current = 0;
    showQuestion();
    window.scrollTo(0, 0);
}
</script>
</body>
</html>
