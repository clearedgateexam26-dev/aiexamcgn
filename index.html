<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Pro | Analysis Mode</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --text: #f0f6fc;
            --primary: #58a6ff;
            --success: #3fb950;
            --danger: #f85149;
            --border: #30363d;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 1rem 2rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }

        /* CONFIG */
        .config {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            background: #0d1117;
            color: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* EXAM LAYOUT */
        .exam { display: none; }
        .layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        .main-card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .option {
            padding: 15px;
            margin: 10px 0;
            background: #21262d;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover { border-color: var(--primary); }
        .selected { background: #1f6feb; border-color: #58a6ff; }

        /* SIDEBAR */
        .sidebar {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .timer { font-size: 2rem; font-weight: 800; text-align: center; color: var(--primary); margin-bottom: 20px; }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .p-btn {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #21262d;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .p-btn.active { border: 2px solid var(--primary); }
        .p-btn.done { background: var(--success); color: white; }

        /* ANALYSIS DASHBOARD */
        .dashboard { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, min-minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
        
        .review-card {
            background: var(--card);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            border-left: 5px solid #30363d;
        }
        .review-card.correct-border { border-left-color: var(--success); }
        .review-card.wrong-border { border-left-color: var(--danger); }
        
        .label { font-size: 0.8rem; text-transform: uppercase; color: #8b949e; }
        .val { font-size: 1.5rem; font-weight: bold; }
        .ans-row { margin-top: 10px; padding: 10px; border-radius: 5px; }
        .bg-success { background: rgba(63, 185, 80, 0.1); color: var(--success); }
        .bg-danger { background: rgba(248, 81, 73, 0.1); color: var(--danger); }

        .loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 20, 0.9); justify-content: center; align-items: center; z-index: 1000;
        }

        @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } .sidebar { order: -1; } }
    </style>
</head>
<body>

<header>
    <h2>AI Exam Pro</h2>
</header>

<div class="loader" id="loader"><h1>Generating Questions...</h1></div>

<div class="container">
    <div class="config" id="config">
        <h3>Exam Settings</h3>
        <label>Topic</label>
        <input type="text" id="topic" placeholder="e.g. JavaScript Closures">
        
        <label>Number of Questions</label>
        <input type="number" id="count" value="5" min="1" max="20">
        
        <label>Time (Minutes)</label>
        <input type="number" id="time" value="5" min="1">

        <label>Difficulty</label>
        <select id="level">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>
        
        <button onclick="startExam()" style="width:100%">Generate & Start</button>
    </div>

    <div class="exam" id="exam">
        <div class="layout">
            <div class="main-card">
                <div id="q-container"></div>
                <div style="margin-top:30px; display:flex; gap:10px;">
                    <button onclick="prev()">Previous</button>
                    <button onclick="next()">Next</button>
                    <button onclick="submitExam()" style="background:var(--danger); margin-left:auto;">Finish Exam</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="timer" id="timer">00:00</div>
                <div class="palette" id="palette"></div>
            </div>
        </div>
    </div>

    <div class="dashboard" id="dash">
        <h1>Exam Analysis</h1>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">Score</div><div class="val" id="res-score">0/0</div></div>
            <div class="stat-card"><div class="label">Accuracy</div><div class="val" id="res-acc">0%</div></div>
            <div class="stat-card"><div class="label">Time Taken</div><div class="val" id="res-time">0s</div></div>
        </div>

        <div style="max-width: 400px; margin: 0 auto 40px auto;">
            <canvas id="resultChart"></canvas>
        </div>

        <h3>Question Breakdown</h3>
        <div id="review-list"></div>
        
        <button onclick="location.reload()" style="margin-top:20px;">Take Another Quiz</button>
    </div>
</div>

<script>
    let quiz = [], userAnswers = [], currentIndex = 0;
    let timeLeft, timerInterval, totalDuration;

    async function startExam() {
        const topic = document.getElementById('topic').value;
        const count = document.getElementById('count').value;
        const level = document.getElementById('level').value;
        totalDuration = document.getElementById('time').value * 60;

        if(!topic) return alert("Enter a topic!");

        document.getElementById('loader').style.display = 'flex';

        try {
            const res = await fetch(`/api/quiz?topic=${encodeURIComponent(topic)}&count=${count}&level=${level}`);
            quiz = await res.json();
            
            userAnswers = new Array(quiz.length).fill(null);
            timeLeft = totalDuration;

            document.getElementById('config').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            document.getElementById('exam').style.display = 'block';

            renderPalette();
            showQuestion();
            startTimer();
        } catch (err) {
            alert("Failed to load quiz. Check server connection.");
            document.getElementById('loader').style.display = 'none';
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    function showQuestion() {
        const q = quiz[currentIndex];
        const container = document.getElementById('q-container');
        
        container.innerHTML = `
            <div class="label">Question ${currentIndex + 1} of ${quiz.length}</div>
            <h2 style="margin: 10px 0 25px 0;">${q.q}</h2>
            <div id="options">
                ${q.options.map((opt, i) => `
                    <div class="option ${userAnswers[currentIndex] === i ? 'selected' : ''}" onclick="selectOption(${i})">
                        ${opt}
                    </div>
                `).join('')}
            </div>
        `;
        updatePaletteUI();
    }

    function selectOption(idx) {
        userAnswers[currentIndex] = idx;
        showQuestion();
    }

    function renderPalette() {
        const p = document.getElementById('palette');
        p.innerHTML = quiz.map((_, i) => `<div class="p-btn" id="p-${i}" onclick="jumpTo(${i})">${i+1}</div>`).join('');
    }

    function updatePaletteUI() {
        quiz.forEach((_, i) => {
            const btn = document.getElementById(`p-${i}`);
            btn.className = 'p-btn';
            if(i === currentIndex) btn.classList.add('active');
            if(userAnswers[i] !== null) btn.classList.add('done');
        });
    }

    function jumpTo(i) { currentIndex = i; showQuestion(); }
    function next() { if(currentIndex < quiz.length - 1) { currentIndex++; showQuestion(); } }
    function prev() { if(currentIndex > 0) { currentIndex--; showQuestion(); } }

    function submitExam() {
        clearInterval(timerInterval);
        document.getElementById('exam').style.display = 'none';
        document.getElementById('dash').style.display = 'block';

        let correct = 0, wrong = 0, skipped = 0;
        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        quiz.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if(userAnswers[i] === null) skipped++;
            else if(isCorrect) correct++;
            else wrong++;

            // Create Review Card
            const card = document.createElement('div');
            card.className = `review-card ${userAnswers[i] === null ? '' : (isCorrect ? 'correct-border' : 'wrong-border')}`;
            
            card.innerHTML = `
                <h4>Q${i+1}: ${q.q}</h4>
                <div class="ans-row ${userAnswers[i] === q.correct ? 'bg-success' : (userAnswers[i] === null ? '' : 'bg-danger')}">
                    <b>Your Answer:</b> ${userAnswers[i] !== null ? q.options[userAnswers[i]] : '<i>Not Answered</i>'}
                </div>
                ${!isCorrect ? `<div class="ans-row bg-success"><b>Correct Answer:</b> ${q.options[q.correct]}</div>` : ''}
                <p style="margin-top:15px; font-size:0.9rem; color:#8b949e"><b>Explanation:</b> ${q.explanation}</p>
            `;
            reviewList.appendChild(card);
        });

        // Update Stats
        document.getElementById('res-score').innerText = `${correct}/${quiz.length}`;
        document.getElementById('res-acc').innerText = `${((correct/quiz.length)*100).toFixed(1)}%`;
        document.getElementById('res-time').innerText = `${totalDuration - timeLeft}s`;

        // Chart
        new Chart(document.getElementById('resultChart'), {
            type: 'doughnut',
            data: {
                labels: ['Correct', 'Wrong', 'Skipped'],
                datasets: [{
                    data: [correct, wrong, skipped],
                    backgroundColor: ['#3fb950', '#f85149', '#30363d']
                }]
            },
            options: { plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
        });
    }
</script>

</body>
</html>
