<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Inter;background:#0b0e14;color:white}
header{padding:15px;background:#111}
button{padding:10px;border:none;border-radius:6px;background:#00e5ff;cursor:pointer}

.config{max-width:500px;margin:30px auto;padding:20px;background:#111;border-radius:10px}
input,select{width:100%;padding:12px;margin:10px 0;background:#222;color:white;border:none}

.loader{
display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:#0b0e14;justify-content:center;align-items:center;flex-direction:column;font-size:1.3rem
}

.exam{display:none;padding:10px}
.layout{display:grid;grid-template-columns:1fr 250px;gap:10px}
.main{background:#111;padding:15px;border-radius:10px}
.option{padding:10px;margin:8px 0;background:#333;border-radius:6px;cursor:pointer}
.selected{background:#00e5ff;color:black}

.sidebar{background:#111;padding:10px;border-radius:10px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.p{padding:6px;background:#222;text-align:center;cursor:pointer}
.p.done{background:#00e5ff;color:black}

.dashboard{display:none;padding:20px}
.card{background:#111;padding:10px;margin:10px 0;border-radius:8px}

@media(max-width:768px){
.layout{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header><h3>AI Exam Pro 🚀</h3></header>

<div class="loader" id="loader">
⚡ Preparing your exam...<br>
<small id="status">Waking server...</small>
</div>

<div class="config" id="config">
<input id="topic" placeholder="Enter topic">
<input id="count" type="number" value="10">
<input id="time" type="number" value="10">

<select id="level">
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>

<button onclick="startExam()">Start Exam</button>
</div>

<div class="exam" id="exam">
<div class="layout">
<div class="main">
<div id="qbox"></div>
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="submitExam()">Submit</button>
</div>

<div class="sidebar">
<div id="timer"></div>
<div id="palette" class="palette"></div>
</div>
</div>
</div>

<div class="dashboard" id="dash">
<h2>Result</h2>
<div id="score"></div>
<div id="accuracy"></div>
<canvas id="chart"></canvas>
<div id="review"></div>
</div>

<script>

let quiz=[],ans=[],i=0,timeLeft,timerInt;

/* 🔥 START */
async function startExam(){

let topic=topicInput().value.trim();
let count=countInput().value;
let time=timeInput().value;
let level=levelInput().value;

if(!topic){
alert("Enter topic");
return;
}

loader(true,"Waking server...");

timeLeft=time*60;

try{

// ⏳ LONG TIMEOUT (60 sec)
let res = await Promise.race([
fetch(`/api/quiz?topic=${encodeURIComponent(topic)}&count=${count}&level=${level}`),
new Promise((_,reject)=>setTimeout(()=>reject("Server slow (Render sleep)"),60000))
]);

loader(true,"Generating questions...");

let data = await res.json();

if(!data || data.length===0){
throw "No questions received";
}

quiz=data;
ans=new Array(quiz.length).fill(null);

loader(false);

config.style.display="none";
exam.style.display="block";

buildPalette();
showQ();
startTimer();

}catch(e){
loader(false);
alert("❌ "+e+"\n\n👉 If using Render free → wait 30 sec and try again");
}

}

/* HELPERS */
function loader(show,msg=""){
document.getElementById("loader").style.display=show?"flex":"none";
document.getElementById("status").innerText=msg;
}

function topicInput(){return document.getElementById("topic")}
function countInput(){return document.getElementById("count")}
function timeInput(){return document.getElementById("time")}
function levelInput(){return document.getElementById("level")}

/* TIMER */
function startTimer(){
timerInt=setInterval(()=>{
timeLeft--;
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
timer.innerText=`${m}:${s<10?"0":""}${s}`;
if(timeLeft<=0)submitExam();
},1000);
}

/* SHOW */
function showQ(){
let q=quiz[i];
qbox.innerHTML=`
<h3>${i+1}. ${q.q}</h3>
${q.options.map((o,x)=>`
<div class="option ${ans[i]==x?"selected":""}" onclick="select(${x})">${o}</div>
`).join("")}
`;
updatePalette();
}

/* ACTION */
function select(x){ans[i]=x;showQ();}
function next(){if(i<quiz.length-1){i++;showQ();}}
function prev(){if(i>0){i--;showQ();}}

/* PALETTE */
function buildPalette(){
palette.innerHTML=quiz.map((_,x)=>`<div class="p" onclick="jump(${x})">${x+1}</div>`).join("");
}
function updatePalette(){
document.querySelectorAll(".p").forEach((el,x)=>{
el.classList.toggle("done",ans[x]!=null);
});
}
function jump(x){i=x;showQ();}

/* RESULT */
function submitExam(){

clearInterval(timerInt);

let c=0,w=0,s=0;

quiz.forEach((q,x)=>{
if(ans[x]==null)s++;
else if(ans[x]==q.correct)c++;
else w++;
});

let acc=((c/quiz.length)*100).toFixed(1);

exam.style.display="none";
dash.style.display="block";

score.innerText=`Score: ${c}/${quiz.length}`;
accuracy.innerText=`Accuracy: ${acc}%`;

new Chart(chart,{
type:"doughnut",
data:{labels:["Correct","Wrong","Skipped"],datasets:[{data:[c,w,s]}]}
});

review.innerHTML="<h2>Answer Review</h2>";

quiz.forEach((q,x)=>{
review.innerHTML+=`
<div class="card">
<b>Q${x+1}. ${q.q}</b><br>
Your: ${ans[x]!=null?q.options[ans[x]]:"Not Attempted"}<br>
Correct: ${q.options[q.correct]}<br>
${q.explanation||""}
</div>
`;
});

}

</script>

</body>
</html>
