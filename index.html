<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Pro Final</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#0b0e14;
    --card:#111;
    --text:#fff;
    --primary:#00e5ff;
}

.light{
    --bg:#f5f5f5;
    --card:#fff;
    --text:#111;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    padding:15px 20px;
    background:var(--card);
}

button{
    padding:10px;
    border:none;
    border-radius:6px;
    background:var(--primary);
    cursor:pointer;
}

/* CONFIG */
.config{
    max-width:500px;
    margin:40px auto;
    padding:25px;
    background:var(--card);
    border-radius:10px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#222;
    color:white;
    border:none;
    border-radius:6px;
}

/* EXAM */
.exam{
    display:none;
    padding:10px;
}

.layout{
    display:grid;
    grid-template-columns:1fr 280px;
    gap:10px;
}

@media(max-width:900px){
    .layout{grid-template-columns:1fr;}
}

.main{
    background:var(--card);
    padding:20px;
    border-radius:10px;
}

.option{
    padding:10px;
    margin:8px 0;
    background:#333;
    border-radius:6px;
    cursor:pointer;
}
.option:hover{background:var(--primary);color:black}
.selected{background:var(--primary);color:black}

/* SIDEBAR */
.sidebar{
    background:var(--card);
    padding:15px;
    border-radius:10px;
}

.timer{
    text-align:center;
    font-size:1.3rem;
    margin-bottom:10px;
}

.palette{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.p{
    padding:8px;
    background:#222;
    text-align:center;
    cursor:pointer;
}

.p.active{border:2px solid var(--primary)}
.p.done{background:var(--primary);color:black}

/* RESULT */
.dashboard{
    display:none;
    padding:20px;
}

.stat{
    background:var(--card);
    padding:10px;
    margin:10px 0;
}
</style>
</head>

<body>

<header>
<h3>AI Exam Pro</h3>
<button onclick="toggleTheme()">🌗</button>
</header>

<!-- CONFIG -->
<div class="config" id="config">

<label>📚 Topic</label>
<input id="topic" placeholder="e.g. Percentage">

<label>🔢 Number of Questions</label>
<input id="count" type="number" min="1" max="100" value="10">

<label>⏱ Time (minutes)</label>
<input id="time" type="number" min="1" max="180" value="10">

<label>🎚 Difficulty</label>
<select id="level">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
</select>

<button onclick="startExam()">Start Exam</button>

</div>

<!-- EXAM -->
<div class="exam" id="exam">

<div class="layout">

<div class="main">
<div id="qbox"></div>

<div style="margin-top:10px;">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="submitExam()">Submit</button>
</div>
</div>

<div class="sidebar">
<div class="timer" id="timer"></div>
<div class="palette" id="palette"></div>
</div>

</div>

</div>

<!-- RESULT -->
<div class="dashboard" id="dash">
<h2>Result</h2>

<div class="stat" id="score"></div>
<div class="stat" id="accuracy"></div>
<div class="stat" id="wrong"></div>
<div class="stat" id="skip"></div>

<canvas id="chart"></canvas>

</div>

<script>

let quiz=[],i=0,ans=[],timeLeft,timerInt;

/* THEME */
function toggleTheme(){
document.body.classList.toggle("light");
}

/* START */
async function startExam(){

let topicInput=document.getElementById("topic").value.trim();
let count=parseInt(document.getElementById("count").value);
let time=parseInt(document.getElementById("time").value);
let level=document.getElementById("level").value;

/* VALIDATION */
if(!topicInput){ alert("Enter topic"); return; }
if(count<=0){ alert("Invalid question count"); return; }
if(time<=0){ alert("Invalid time"); return; }

timeLeft=time*60;

try{

let res=await fetch(`/api/quiz?topic=${encodeURIComponent(topicInput)}&count=${count}&level=${level}`);
quiz=await res.json();

if(!Array.isArray(quiz)){
alert("API error");
return;
}

ans=new Array(quiz.length).fill(null);

config.style.display="none";
exam.style.display="block";

buildPalette();
showQ();
startTimer();

}catch(e){
alert("Failed to load quiz");
}
}

/* TIMER */
function startTimer(){
timerInt=setInterval(()=>{
timeLeft--;
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
timer.innerText=`${m}:${s<10?"0":""}${s}`;
if(timeLeft<=0)submitExam();
},1000);
}

/* PALETTE */
function buildPalette(){
palette.innerHTML=quiz.map((_,x)=>`
<div class="p" id="p${x}" onclick="jump(${x})">${x+1}</div>
`).join("");
}

/* SHOW */
function showQ(){
let q=quiz[i];

qbox.innerHTML=`
<h3>${i+1}. ${q.q}</h3>
${q.options.map((o,x)=>`
<div class="option ${ans[i]==x?"selected":""}" onclick="select(${x})">${o}</div>
`).join("")}
`;

document.querySelectorAll(".p").forEach(e=>e.classList.remove("active"));
document.getElementById("p"+i).classList.add("active");

ans.forEach((a,x)=>{
if(a!=null) document.getElementById("p"+x).classList.add("done");
});
}

/* ACTION */
function select(x){ ans[i]=x; showQ(); }
function next(){ if(i<quiz.length-1){i++;showQ();}}
function prev(){ if(i>0){i--;showQ();}}
function jump(x){i=x;showQ();}

/* RESULT */
function submitExam(){

clearInterval(timerInt);

let correct=0,wrong=0,skip=0;

quiz.forEach((q,x)=>{
if(ans[x]==null) skip++;
else if(ans[x]==q.correct) correct++;
else wrong++;
});

let acc=((correct/quiz.length)*100).toFixed(1);

exam.style.display="none";
dash.style.display="block";

score.innerText=`Score: ${correct}/${quiz.length}`;
accuracy.innerText=`Accuracy: ${acc}%`;
wrong.innerText=`Wrong: ${wrong}`;
skip.innerText=`Skipped: ${skip}`;

new Chart(chart,{
type:"doughnut",
data:{
labels:["Correct","Wrong","Skipped"],
datasets:[{data:[correct,wrong,skip]}]
}
});

}

</script>

</body>
</html>
