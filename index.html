<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Ultra Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#0b0e14;
    --card:rgba(255,255,255,0.05);
    --text:#fff;
    --primary:#00e5ff;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#0b0e14,#16222a);
    color:var(--text);
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    padding:15px 25px;
    backdrop-filter:blur(10px);
}

/* CONFIG */
.config{
    max-width:500px;
    margin:60px auto;
    background:var(--card);
    padding:30px;
    border-radius:15px;
    backdrop-filter:blur(15px);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--primary);
    font-weight:600;
    cursor:pointer;
}

/* LOADER */
.loader-screen{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:#0b0e14;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:999;
}

.spinner{
    width:50px;
    height:50px;
    border:5px solid #333;
    border-top:5px solid var(--primary);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

/* EXAM */
.exam{display:none;padding:20px;}
.card{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    backdrop-filter:blur(10px);
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1}
}

.option{
    padding:12px;
    margin:8px 0;
    background:#2a2a2a;
    border-radius:8px;
    cursor:pointer;
}
.option:hover{background:var(--primary);color:black}
.selected{background:var(--primary);color:black}

/* DASHBOARD */
.dashboard{
    display:none;
    padding:20px;
}
</style>
</head>

<body>

<header>
<h3>AI Exam Ultra</h3>
</header>

<!-- LOADER -->
<div class="loader-screen" id="loader">
<div class="spinner"></div>
<p>Generating AI Questions...</p>
</div>

<!-- CONFIG -->
<div class="config" id="config">
<input id="topic" placeholder="Enter topic">
<input id="count" type="number" value="10">
<input id="time" type="number" value="10">
<button onclick="startExam()" id="startBtn">Start Exam</button>
</div>

<!-- EXAM -->
<div class="exam" id="exam">
<div id="timer"></div>
<div id="qbox"></div>
<button onclick="next()">Next</button>
<button onclick="submitExam()">Submit</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">
<h2>Result</h2>
<canvas id="chart"></canvas>
<div id="summary"></div>
</div>

<script>
let quiz=[],i=0,ans=[],timeLeft,timerInt;

async function startExam(){
let btn=document.getElementById("startBtn");
btn.disabled=true;

loader.style.display="flex";

let topic=topic.value;
let count=document.getElementById("count").value;
let time=document.getElementById("time").value;

timeLeft=time*60;

try{
let res=await fetch(`/api/quiz?topic=${topic}&count=${count}`);
quiz=await res.json();

loader.style.display="none";
config.style.display="none";
exam.style.display="block";

ans=new Array(quiz.length).fill(null);

showQ();
startTimer();

}catch(e){
loader.style.display="none";
alert("Error loading questions");
btn.disabled=false;
}
}

function startTimer(){
timerInt=setInterval(()=>{
timeLeft--;
timer.innerText=timeLeft;
if(timeLeft<=0)submitExam();
},1000);
}

function showQ(){
let q=quiz[i];

qbox.innerHTML=`
<div class="card">
<h3>${i+1}. ${q.q}</h3>
${q.options.map((o,x)=>`
<div class="option ${ans[i]==x?"selected":""}" onclick="select(${x})">${o}</div>
`).join("")}
</div>
`;
}

function select(x){
ans[i]=x;
showQ();
}

function next(){ if(i<quiz.length-1){i++;showQ();}}

function submitExam(){
clearInterval(timerInt);

let correct=0,wrong=0,skip=0;

quiz.forEach((q,x)=>{
if(ans[x]==null)skip++;
else if(ans[x]==q.correct)correct++;
else wrong++;
});

exam.style.display="none";
dash.style.display="block";

summary.innerHTML=`
Score: ${correct}/${quiz.length}<br>
Wrong: ${wrong}<br>
Skipped: ${skip}
`;

new Chart(chart,{
type:"pie",
data:{
labels:["Correct","Wrong","Skipped"],
datasets:[{data:[correct,wrong,skip]}]
}
});
}
</script>

</body>
</html>
