<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Pro MAX | Intelligence Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --dark-bg: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --success: #00c853;
            --danger: #ff5252;
            --warning: #ffd600;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body {
            margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #16222a, #0b0e14);
            color: #e0e0e0; min-height: 100vh; overflow-x: hidden;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* Modern Header */
        header { text-align: center; padding: 40px 0; }
        .logo { 
            font-size: 2.5rem; font-weight: 800; 
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: -1px;
        }

        /* Search Area */
        .search-container {
            display: flex; gap: 10px; max-width: 600px; margin: 0 auto 40px;
            background: var(--card-bg); padding: 8px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input {
            flex: 1; background: transparent; border: none; padding: 15px;
            color: white; font-size: 1.1rem; outline: none;
        }
        .btn-gen {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            color: #000; border: none; padding: 0 30px; border-radius: 12px;
            font-weight: 700; cursor: pointer;
        }
        .btn-gen:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(79, 172, 254, 0.4); }

        /* Main Quiz Layout */
        .quiz-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; display: none; }
        @media (max-width: 850px) { .quiz-layout { grid-template-columns: 1fr; } }

        /* Left Column: Question Card */
        .question-card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .q-meta { display: flex; justify-content: space-between; margin-bottom: 20px; color: #888; font-weight: 600; }
        h2 { font-size: 1.4rem; line-height: 1.5; margin-bottom: 30px; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option {
            background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.08);
            padding: 18px; border-radius: 14px; cursor: pointer; display: flex; align-items: center;
            gap: 15px; position: relative;
        }
        .option:hover:not(.locked) { background: rgba(255,255,255,0.08); border-color: var(--secondary); }
        .option.selected { background: rgba(79, 172, 254, 0.15); border-color: var(--secondary); }
        
        .opt-char { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 8px; font-weight: 700; font-size: 0.9rem; }
        .selected .opt-char { background: var(--secondary); color: #000; }

        /* Right Column: Palette */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .timer-box { background: rgba(255, 214, 0, 0.1); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--warning); }
        #timer { font-size: 1.8rem; font-weight: 800; color: var(--warning); font-family: 'Courier New', monospace; }

        .palette {
            background: var(--card-bg); padding: 20px; border-radius: 20px;
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
        }
        .p-item {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background: #222; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 700;
        }
        .p-item.active { outline: 2px solid var(--primary); }
        .p-item.answered { background: var(--secondary); color: #000; }

        /* Correct/Wrong Logic */
        .correct { background: rgba(0, 200, 83, 0.2) !important; border-color: var(--success) !important; }
        .wrong { background: rgba(255, 82, 82, 0.2) !important; border-color: var(--danger) !important; }

        .explanation {
            margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.3);
            border-radius: 15px; border-left: 5px solid var(--secondary); display: none;
        }

        /* Result View */
        .results-view { text-align: center; display: none; padding: 40px; }
        .score-circle {
            width: 200px; height: 200px; border-radius: 50%; border: 10px solid var(--secondary);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin: 0 auto 30px; font-size: 3rem; font-weight: 900;
        }

        .hidden { display: none; }
        .footer-nav { display: flex; justify-content: space-between; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">AI Exam Pro MAX <span style="font-size: 0.8rem; vertical-align: middle; opacity: 0.6;">v2.0</span></div>
    </header>

    <div class="search-container">
        <input type="text" id="topicInput" placeholder="Enter topic (e.g. UPSC Modern History)">
        <button class="btn-gen" id="genBtn" onclick="initiateQuiz()">Generate</button>
    </div>

    <div class="quiz-layout" id="mainLayout">
        <div class="left-col">
            <div id="questionArea"></div>
            <div class="footer-nav">
                <button onclick="nav(-1)" class="btn-gen" style="background: #333; color: white;">Prev</button>
                <button onclick="nav(1)" class="btn-gen">Next</button>
                <button onclick="finishQuiz()" class="btn-gen" style="background: var(--success);">Submit</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="timer-box">
                <div style="font-size: 0.8rem; text-transform: uppercase;">Remaining Time</div>
                <div id="timer">10:00</div>
            </div>
            <div class="palette" id="questionPalette"></div>
        </div>
    </div>

    <div class="results-view" id="resultsView">
        <div class="score-circle" id="scoreCircle">0%</div>
        <h2 id="scoreText">You scored 0 out of 10</h2>
        <button class="btn-gen" onclick="location.reload()">Try Another Topic</button>
        <button class="btn-gen" style="background: #333; color: white;" onclick="toggleReview()">Review Answers</button>
    </div>
</div>

<script>
    let questions = [];
    let currentIdx = 0;
    let userSelections = [];
    let isReviewMode = false;
    let secondsLeft = 600;
    let timerInterval;

    async function initiateQuiz() {
        const topic = document.getElementById('topicInput').value;
        if (!topic) return alert("Please specify a topic.");

        const genBtn = document.getElementById('genBtn');
        genBtn.disabled = true;
        genBtn.innerText = "Processing...";

        try {
            const res = await fetch(`/api/quiz?topic=${encodeURIComponent(topic)}`);
            questions = await res.json();
            userSelections = new Array(questions.length).fill(null);
            
            document.getElementById('mainLayout').style.display = 'grid';
            document.querySelector('.search-container').style.display = 'none';
            
            startTimer();
            buildPalette();
            renderQuestion();
        } catch (e) {
            alert("AI generation failed. Please try again.");
            genBtn.disabled = false;
            genBtn.innerText = "Generate";
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            secondsLeft--;
            const m = Math.floor(secondsLeft / 60);
            const s = secondsLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if (secondsLeft <= 0) finishQuiz();
        }, 1000);
    }

    function buildPalette() {
        const pal = document.getElementById('questionPalette');
        pal.innerHTML = questions.map((_, i) => `
            <div class="p-item" id="pal-${i}" onclick="jumpTo(${i})">${i + 1}</div>
        `).join('');
    }

    function renderQuestion() {
        const q = questions[currentIdx];
        const area = document.getElementById('questionArea');
        
        const optionsHtml = q.options.map((opt, i) => {
            let cls = "option";
            if (userSelections[currentIdx] === i) cls += " selected";
            if (isReviewMode) {
                cls += " locked";
                if (i === q.correct) cls += " correct";
                if (userSelections[currentIdx] === i && i !== q.correct) cls += " wrong";
            }

            return `
                <div class="${cls}" onclick="makeSelection(${i})">
                    <div class="opt-char">${String.fromCharCode(65 + i)}</div>
                    <div>${opt}</div>
                </div>
            `;
        }).join('');

        area.innerHTML = `
            <div class="question-card">
                <div class="q-meta">
                    <span>Topic: ${document.getElementById('topicInput').value}</span>
                    <span>Q ${currentIdx + 1} / ${questions.length}</span>
                </div>
                <h2>${q.q}</h2>
                <div class="options-grid">${optionsHtml}</div>
                <div class="explanation" style="display: ${isReviewMode ? 'block' : 'none'}">
                    <i class="fas fa-lightbulb" style="color: var(--warning)"></i> 
                    <strong>AI Insight:</strong><br>${q.explanation}
                </div>
            </div>
        `;

        // Update Palette colors
        document.querySelectorAll('.p-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`pal-${currentIdx}`).classList.add('active');
        userSelections.forEach((sel, i) => {
            if (sel !== null) document.getElementById(`pal-${i}`).classList.add('answered');
        });
    }

    function makeSelection(i) {
        if (isReviewMode) return;
        userSelections[currentIdx] = i;
        renderQuestion();
    }

    function jumpTo(i) {
        currentIdx = i;
        renderQuestion();
    }

    function nav(dir) {
        let target = currentIdx + dir;
        if (target >= 0 && target < questions.length) {
            currentIdx = target;
            renderQuestion();
        }
    }

    function finishQuiz() {
        if (!isReviewMode && !confirm("Finish and see results?")) return;
        
        clearInterval(timerInterval);
        let score = 0;
        questions.forEach((q, i) => {
            if (userSelections[i] === q.correct) score++;
        });

        const percent = Math.round((score / questions.length) * 100);
        document.getElementById('mainLayout').style.display = 'none';
        document.getElementById('resultsView').style.display = 'block';
        document.getElementById('scoreCircle').innerText = `${percent}%`;
        document.getElementById('scoreText').innerText = `You correctly answered ${score} out of ${questions.length} questions.`;
    }

    function toggleReview() {
        isReviewMode = true;
        document.getElementById('resultsView').style.display = 'none';
        document.getElementById('mainLayout').style.display = 'grid';
        currentIdx = 0;
        renderQuestion();
    }
</script>
</body>
</html>
