<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Ultra Pro X</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* =========================
   GLOBAL DESIGN SYSTEM
========================= */

:root{
    --bg:#0b0e14;
    --card:rgba(255,255,255,0.05);
    --text:#ffffff;
    --primary:#00e5ff;
    --secondary:#4facfe;
    --muted:#888;
    --radius:12px;
}

.light{
    --bg:#f5f5f5;
    --card:#ffffff;
    --text:#111;
    --muted:#555;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    transition:all 0.2s ease;
}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(135deg,#0b0e14,#16222a);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.3);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:1.3rem;
    font-weight:800;
    background:linear-gradient(to right,var(--primary),var(--secondary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.theme-btn{
    cursor:pointer;
}

/* =========================
   CONFIG PANEL
========================= */

.config{
    max-width:500px;
    margin:60px auto;
    padding:30px;
    background:var(--card);
    border-radius:var(--radius);
    backdrop-filter:blur(15px);
}

.input-group{
    margin-bottom:15px;
}

label{
    font-size:0.8rem;
    color:var(--muted);
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

.start-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--primary);
    font-weight:600;
    cursor:pointer;
}

/* =========================
   LOADER
========================= */

.loader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0b0e14;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:999;
}

.spinner{
    width:60px;
    height:60px;
    border:6px solid #333;
    border-top:6px solid var(--primary);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

/* =========================
   EXAM LAYOUT
========================= */

.exam{
    display:none;
    height:calc(100vh - 60px);
}

.layout{
    display:grid;
    grid-template-columns:1fr 280px;
    height:100%;
}

@media(max-width:900px){
    .layout{grid-template-columns:1fr;}
}

/* LEFT */
.main{
    padding:25px;
    overflow:auto;
}

/* QUESTION CARD */
.card{
    background:var(--card);
    padding:25px;
    border-radius:var(--radius);
    backdrop-filter:blur(10px);
}

/* OPTIONS */
.option{
    padding:12px;
    margin:8px 0;
    background:#2a2a2a;
    border-radius:8px;
    cursor:pointer;
}

.option:hover{
    background:var(--primary);
    color:black;
}

.selected{
    background:var(--primary);
    color:black;
}

/* NAV */
.nav{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

/* SIDEBAR */
.sidebar{
    padding:20px;
    border-left:1px solid rgba(255,255,255,0.05);
}

/* TIMER */
.timer{
    font-size:1.4rem;
    text-align:center;
    margin-bottom:15px;
}

/* PALETTE */
.palette{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

.p{
    padding:10px;
    background:#222;
    text-align:center;
    border-radius:6px;
    cursor:pointer;
}

.p.active{border:2px solid var(--primary)}
.p.done{background:var(--primary);color:black}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:none;
    padding:30px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
}

.stat{
    background:var(--card);
    padding:20px;
    text-align:center;
    border-radius:var(--radius);
}

canvas{
    margin-top:25px;
}

/* =========================
   ANIMATION
========================= */

.fade{
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1}
}

</style>
</head>

<body>

<header>
<div class="logo">AI Exam Ultra Pro X</div>
<div class="theme-btn" onclick="toggleTheme()">🌗</div>
</header>

<!-- CONFIG -->
<div class="config" id="config">
<div class="input-group">
<label>Topic</label>
<input id="topic" placeholder="e.g. Percentage">
</div>

<div class="input-group">
<label>Number of Questions</label>
<input id="count" type="number" value="10">
</div>

<div class="input-group">
<label>Time (minutes)</label>
<input id="time" type="number" value="10">
</div>

<button class="start-btn" onclick="startExam()">Start Exam</button>
</div>

<!-- LOADER -->
<div class="loader" id="loader">
<div class="spinner"></div>
<p>Preparing your exam...</p>
</div>

<!-- EXAM -->
<div class="exam" id="exam">
<div class="layout">

<div class="main">
<div id="qbox"></div>

<div class="nav">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="submitExam()">Submit</button>
</div>
</div>

<div class="sidebar">
<div class="timer" id="timer"></div>
<div class="palette" id="palette"></div>
</div>

</div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dash">

<h2>Performance Dashboard</h2>

<div class="stats">
<div class="stat" id="score"></div>
<div class="stat" id="accuracy"></div>
<div class="stat" id="wrong"></div>
<div class="stat" id="skip"></div>
</div>

<canvas id="chart"></canvas>

<div id="insight"></div>

</div>

<script>

/* =========================
   STATE
========================= */

let quiz=[],i=0,ans=[],timeLeft,timerInt;

/* =========================
   THEME
========================= */

function toggleTheme(){
document.body.classList.toggle("light");
}

/* =========================
   START EXAM
========================= */

async function startExam(){

loader.style.display="flex";

let topic=topic.value;
let count=document.getElementById("count").value;
let time=document.getElementById("time").value;

timeLeft=time*60;

try{

let res=await fetch(`/api/quiz?topic=${topic}&count=${count}`);
quiz=await res.json();

loader.style.display="none";
config.style.display="none";
exam.style.display="block";

ans=new Array(quiz.length).fill(null);

buildPalette();
showQ();
startTimer();

}catch(e){
loader.style.display="none";
alert("Error loading quiz");
}

}

/* =========================
   TIMER
========================= */

function startTimer(){
timerInt=setInterval(()=>{
timeLeft--;
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
timer.innerText=`${m}:${s<10?"0":""}${s}`;
if(timeLeft<=0)submitExam();
},1000);
}

/* =========================
   PALETTE
========================= */

function buildPalette(){
let html="";
quiz.forEach((_,x)=>{
html+=`<div class="p" id="p${x}" onclick="jump(${x})">${x+1}</div>`;
});
palette.innerHTML=html;
}

/* =========================
   SHOW QUESTION
========================= */

function showQ(){
let q=quiz[i];

qbox.innerHTML=`
<div class="card fade">
<h3>${i+1}. ${q.q}</h3>
${q.options.map((o,x)=>`
<div class="option ${ans[i]==x?"selected":""}" onclick="select(${x})">${o}</div>
`).join("")}
</div>
`;

document.querySelectorAll(".p").forEach(e=>e.classList.remove("active"));
document.getElementById("p"+i).classList.add("active");

ans.forEach((a,x)=>{
if(a!=null) document.getElementById("p"+x).classList.add("done");
});
}

/* =========================
   ACTIONS
========================= */

function select(x){
ans[i]=x;
showQ();
}

function next(){ if(i<quiz.length-1){i++;showQ();}}
function prev(){ if(i>0){i--;showQ();}}
function jump(x){i=x;showQ();}

/* =========================
   RESULT
========================= */

function submitExam(){

clearInterval(timerInt);

let correct=0,wrong=0,skip=0;

quiz.forEach((q,x)=>{
if(ans[x]==null) skip++;
else if(ans[x]==q.correct) correct++;
else wrong++;
});

let acc=((correct/quiz.length)*100).toFixed(1);

exam.style.display="none";
dash.style.display="block";

score.innerText=`Score: ${correct}/${quiz.length}`;
accuracy.innerText=`Accuracy: ${acc}%`;
wrong.innerText=`Wrong: ${wrong}`;
skip.innerText=`Skipped: ${skip}`;

new Chart(chart,{
type:"doughnut",
data:{
labels:["Correct","Wrong","Skipped"],
datasets:[{data:[correct,wrong,skip]}]
}
});

insight.innerText =
acc>80?"🔥 Excellent":
acc>50?"👍 Good":
"⚠️ Improve";

}

</script>

</body>
</html>
