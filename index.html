<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Pro ULTRA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#0b0e14;
    --card:rgba(255,255,255,0.05);
    --primary:#00e5ff;
    --accent:#4facfe;
}

body {
    margin:0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top,#16222a,#0b0e14);
    color:white;
}

/* HEADER */
header {
    position: sticky;
    top:0;
    backdrop-filter: blur(15px);
    background: rgba(0,0,0,0.4);
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    z-index:10;
}

.logo {
    font-weight:800;
    font-size:1.4rem;
    background:linear-gradient(to right,var(--primary),var(--accent));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* SEARCH */
.search {
    display:flex;
    gap:10px;
    margin:30px auto;
    max-width:600px;
}
.search input {
    flex:1;
    padding:14px;
    border-radius:12px;
    border:none;
    background:#1e1e1e;
    color:white;
}
.search button {
    padding:14px 25px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    font-weight:bold;
}

/* LAYOUT */
.layout {
    display:none;
    grid-template-columns:1fr 300px;
    gap:20px;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

@media(max-width:900px){
    .layout{grid-template-columns:1fr;}
}

/* CARD */
.card {
    background:var(--card);
    backdrop-filter: blur(15px);
    border-radius:20px;
    padding:30px;
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1}
}

/* OPTIONS */
.option {
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    background:#2a2a2a;
    cursor:pointer;
}
.option:hover {
    background:var(--primary);
    color:black;
}
.selected {background:var(--primary);color:black;}
.correct {background:green !important;}
.wrong {background:red !important;}

/* SIDEBAR */
.sidebar {
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* TIMER CIRCLE */
.timer {
    width:120px;
    height:120px;
    border-radius:50%;
    border:6px solid var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    margin:auto;
}

/* PALETTE */
.palette {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}
.p {
    padding:10px;
    background:#222;
    text-align:center;
    border-radius:8px;
    cursor:pointer;
}
.p.active{border:2px solid cyan;}
.p.answered{background:cyan;color:black;}
.p.flag{background:orange;color:black;}

/* FOOTER NAV */
.nav {
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

/* RESULT */
.result {
    text-align:center;
    display:none;
    padding:40px;
}
.score {
    font-size:3rem;
    font-weight:800;
}
</style>
</head>

<body>

<header>
<div class="logo">AI Exam ULTRA</div>
<button onclick="toggleTheme()">🌗</button>
</header>

<div class="search">
<input id="topic" placeholder="Enter topic (Banking, SSC, UPSC)">
<button onclick="start()">Start</button>
</div>

<div class="layout" id="layout">

<div>
<div id="qbox"></div>

<div class="nav">
<button onclick="prev()">⬅</button>
<button onclick="flag()">🚩</button>
<button onclick="next()">➡</button>
<button onclick="submit()">Submit</button>
</div>
</div>

<div class="sidebar">
<div class="timer" id="timer">600</div>
<div class="palette" id="pal"></div>
</div>

</div>

<div class="result" id="res"></div>

<script>
let quiz=[],i=0,ans=[],flagged=[],t=600,interval;

function toggleTheme(){
document.body.classList.toggle("light");
}

async function start(){
let topic=document.getElementById("topic").value;

let r=await fetch(`/api/quiz?topic=${topic}`);
quiz=await r.json();

ans=new Array(quiz.length).fill(null);
flagged=new Array(quiz.length).fill(false);

document.querySelector(".layout").style.display="grid";

buildPal();
show();
timer();
}

function timer(){
interval=setInterval(()=>{
t--;
document.getElementById("timer").innerText=t;
if(t<=0)submit();
},1000);
}

function buildPal(){
let html="";
quiz.forEach((_,x)=>{
html+=`<div class="p" id="p${x}" onclick="jump(${x})">${x+1}</div>`;
});
pal.innerHTML=html;
}

function show(){
let q=quiz[i];

qbox.innerHTML=`
<div class="card">
<h3>${i+1}. ${q.q}</h3>
${q.options.map((o,x)=>`
<div class="option ${ans[i]==x?"selected":""}" onclick="select(${x})">${o}</div>
`).join("")}
<div class="explanation">${q.explanation}</div>
</div>
`;

document.querySelectorAll(".p").forEach(e=>e.classList.remove("active"));
document.getElementById("p"+i).classList.add("active");

ans.forEach((a,x)=>{
if(a!=null) document.getElementById("p"+x).classList.add("answered");
if(flagged[x]) document.getElementById("p"+x).classList.add("flag");
});
}

function select(x){
ans[i]=x;
show();
}

function next(){ if(i<quiz.length-1){i++;show();}}
function prev(){ if(i>0){i--;show();}}
function jump(x){i=x;show();}

function flag(){
flagged[i]=!flagged[i];
show();
}

function submit(){
clearInterval(interval);

let c=0,w=0,s=0;

quiz.forEach((q,x)=>{
if(ans[x]==null)s++;
else if(ans[x]==q.correct)c++;
else w++;
});

let acc=((c/quiz.length)*100).toFixed(1);

layout.style.display="none";
res.style.display="block";

res.innerHTML=`
<div class="score">${acc}%</div>
<p>Correct: ${c}</p>
<p>Wrong: ${w}</p>
<p>Skipped: ${s}</p>
<button onclick="location.reload()">Restart</button>
`;
}
</script>

</body>
</html>
