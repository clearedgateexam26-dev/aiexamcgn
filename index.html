<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Exam Config Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#00e5ff;
    --bg:#0b0e14;
    --card:#111;
}

body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:white;
}

/* HEADER */
header{
    padding:15px;
    text-align:center;
    font-size:1.5rem;
    font-weight:800;
    background:linear-gradient(90deg,#00e5ff,#4facfe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* CONFIG BOX */
.config{
    max-width:600px;
    margin:40px auto;
    background:var(--card);
    padding:30px;
    border-radius:15px;
}

label{
    font-size:0.9rem;
    opacity:0.7;
}

input,select{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

/* Toggle */
.toggle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#222;
    padding:10px;
    border-radius:8px;
}

.switch{
    position:relative;
    width:50px;height:25px;
}
.switch input{display:none;}
.slider{
    position:absolute;
    cursor:pointer;
    background:#555;
    border-radius:25px;
    top:0;left:0;right:0;bottom:0;
}
.slider:before{
    content:"";
    position:absolute;
    height:20px;width:20px;
    left:3px;top:2px;
    background:white;
    border-radius:50%;
    transition:0.3s;
}
input:checked + .slider{
    background:var(--primary);
}
input:checked + .slider:before{
    transform:translateX(24px);
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    background:var(--primary);
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

/* EXAM */
.exam{
    display:none;
    padding:20px;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
}

.option{
    padding:10px;
    margin:8px 0;
    background:#333;
    border-radius:8px;
    cursor:pointer;
}
.selected{
    background:var(--primary);
    color:black;
}

/* TOP BAR */
.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

/* RESPONSIVE */
@media(max-width:600px){
    .config{margin:20px;}
}
</style>
</head>

<body>

<header>AI Exam Setup Pro</header>

<!-- CONFIG -->
<div class="config" id="configBox">

<label>📚 Topic</label>
<input id="topic" placeholder="e.g. Percentage">

<label>🔢 Number of Questions</label>
<input type="number" id="count" value="10">

<label>⏱ Time (minutes)</label>
<input type="number" id="time" value="10">

<label>📄 Previous Year Questions</label>
<div class="toggle">
    <span>Include PYQs</span>
    <label class="switch">
        <input type="checkbox" id="pyq">
        <span class="slider"></span>
    </label>
</div>

<br>
<button onclick="startExam()">Start Exam</button>

</div>

<!-- EXAM -->
<div class="exam" id="examBox">

<div class="top">
<div id="qno"></div>
<div id="timer"></div>
</div>

<div id="question"></div>

<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
<button onclick="submitExam()">Submit</button>

</div>

<script>

let quiz=[],i=0,answers=[],timeLeft,interval;

/* START */
async function startExam(){
    let topic=document.getElementById("topic").value;
    let count=document.getElementById("count").value;
    let time=document.getElementById("time").value;
    let pyq=document.getElementById("pyq").checked;

    timeLeft=time*60;

    let res=await fetch(`/api/quiz?topic=${topic}&count=${count}&pyq=${pyq}`);
    quiz=await res.json();

    answers=new Array(quiz.length).fill(null);

    document.getElementById("configBox").style.display="none";
    document.getElementById("examBox").style.display="block";

    showQ();
    startTimer();
}

/* TIMER */
function startTimer(){
    interval=setInterval(()=>{
        timeLeft--;
        let m=Math.floor(timeLeft/60);
        let s=timeLeft%60;
        document.getElementById("timer").innerText=`${m}:${s<10?"0":""}${s}`;
        if(timeLeft<=0) submitExam();
    },1000);
}

/* SHOW QUESTION */
function showQ(){
    let q=quiz[i];

    document.getElementById("qno").innerText=`Q ${i+1}/${quiz.length}`;

    document.getElementById("question").innerHTML=`
    <div class="card">
        <h3>${q.q}</h3>
        ${q.options.map((o,x)=>`
            <div class="option ${answers[i]==x?"selected":""}" onclick="select(${x})">${o}</div>
        `).join("")}
    </div>
    `;
}

function select(x){
    answers[i]=x;
    showQ();
}

function next(){ if(i<quiz.length-1){i++;showQ();}}
function prev(){ if(i>0){i--;showQ();}}

/* RESULT */
function submitExam(){
    clearInterval(interval);

    let score=0;
    let html="<h2>Result + Explanation</h2>";

    quiz.forEach((q,x)=>{
        if(answers[x]==q.correct) score++;

        html+=`
        <div class="card">
        <b>Q${x+1}. ${q.q}</b><br>
        Your: ${answers[x]!=null?q.options[answers[x]]:"Not Attempted"}<br>
        Correct: ${q.options[q.correct]}<br>
        <small>${q.explanation}</small>
        </div>
        `;
    });

    html=`<h2>Score: ${score}/${quiz.length}</h2>` + html;

    document.getElementById("examBox").innerHTML=html;
}

</script>

</body>
</html>
